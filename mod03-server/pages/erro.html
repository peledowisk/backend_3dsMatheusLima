<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | teleporco</title>
    <style>
        /* Mudança para fundo preto e centralização simples */
        body { 
            background-color: #000000;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        h3 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        p {
            color: #a0a0a0;
            margin-bottom: 25px;
        }

        /* Estilização do link mantendo a estrutura original */
        a { 
            color: #ffffff;
            text-decoration: none;
            border: 1px solid #ffffff;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        a:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
    <style>
        :root { --blue: #155eef; --blue-dark: #082567; --pink: #f63384; --paper: #ffffff; }
        * { box-sizing: border-box; }
        body {
            align-items: center;
            background: linear-gradient(135deg, var(--blue-dark), var(--blue));
            color: var(--paper);
            display: flex;
            min-height: 100vh;
            padding: 24px;
        }
        .error-card {
            background: rgba(255, 255, 255, .12);
            border: 1px solid rgba(255, 255, 255, .3);
            border-radius: 18px;
            max-width: 560px;
            padding: 42px 32px;
            width: 100%;
        }
        .brand { font-size: 1.3rem; font-weight: 900; letter-spacing: .04em; }
        .brand span { color: #ffb3d1; }
        .error-image { border: 8px solid var(--paper); border-radius: 50%; box-shadow: 8px 8px 0 var(--pink); margin: 28px auto; max-width: 220px; width: 65%; }
        h1 { color: #ffd0e4; font-size: clamp(3rem, 10vw, 5.5rem); line-height: 1; margin: 0 0 12px; }
        h2 { margin: 0 0 12px; }
        p { color: #e1eaff; line-height: 1.6; margin: 0 auto 28px; }
        a { background: var(--pink); border-radius: 8px; color: var(--paper); display: inline-block; font-weight: 800; padding: 14px 22px; text-decoration: none; }
        a:hover { background: #ff6aa8; }
    </style>
    <link rel="stylesheet" href="/public/erro.css">
</head>
<body>
    <main class="error-card">
        <div class="brand">tele<span>porco</span></div>
        <img class="error-image" src="/image/image.png" alt="Mascote da teleporco">
        <h1>404</h1>
        <h2>Ops! Essa página saiu da cartela.</h2>
        <p>O endereço não foi encontrado, mas a sua sorte ainda está por aqui.</p>
        <a href="/">Voltar para a home</a>
    </main>
</body>
</html>
